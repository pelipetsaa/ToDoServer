# `./gradlew bootRun` starts the postgres service automatically (spring-boot-docker-compose).
# The whole stack, server included: docker compose --profile app up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: todolist
    ports:
      - "5434:5432"
    volumes:
      - todolist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todolist -d todolist"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      API_DOCS_ENABLED: "true"
      DB_URL: jdbc:postgresql://postgres:5432/todolist
      DB_USER: todolist
      DB_PASSWORD: todolist
    ports:
      - "8080:8080"

volumes:
  todolist-pgdata:
