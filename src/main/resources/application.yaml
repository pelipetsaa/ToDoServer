# Environment variables are the same as the Ktor server's, so this server is a drop-in replacement.
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: todo-server
  threads:
    virtual:
      enabled: true
  datasource:
    # No default credentials: `./gradlew bootRun` and the tests take the database from compose.yaml or Testcontainers.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/todolist}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      # Virtual threads do not queue in a thread pool; under overload they wait here, so fail fast rather than pile up.
      connection-timeout: 5000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      # Only `./gradlew bootRun` uses compose.yaml (spring-boot-docker-compose is a development-only dependency).
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  # The Docker image turns the docs off; set API_DOCS_ENABLED=true to publish them.
  swagger-ui:
    path: /docs
    enabled: ${API_DOCS_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  # "production" (default) or "development". Production refuses to start without a real JWT_SECRET; development signs
  # tokens with a key published in this repository, so it must be asked for (`./gradlew bootRun` does).
  environment: ${APP_ENV:production}
  # Set to true only behind a reverse proxy that sets X-Forwarded-For (e.g. Render), so rate limits see client IPs.
  trust-proxy: ${TRUST_PROXY:false}
  # Proxies that append to X-Forwarded-For, e.g. 2 for a CDN in front of Render.
  trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
  jwt:
    # Required in production (at least 32 characters). Without it, development uses a built-in key.
    secret: ${JWT_SECRET:}
    issuer: todolist-server
    audience: todolist-clients
    realm: todolist
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-sessions-per-user: ${MAX_SESSIONS_PER_USER:10}
  password:
    bcrypt-cost: 12
  google:
    # Comma-separated OAuth client IDs (web, android, ios) accepted as the ID token audience.
    client-ids: ${GOOGLE_CLIENT_IDS:942997837259-p5avn0h84otleksfs47cnbrr7gs52t2c.apps.googleusercontent.com,942997837259-56nldcuks4gmmaju4hvr15ttik6ra6h7.apps.googleusercontent.com}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    login-attempts-per-account-per-minute: ${LOGIN_RATE_LIMIT_PER_ACCOUNT:10}
  todos:
    max-list-range: 366d
    max-per-user: ${MAX_TODOS_PER_USER:10000}
  metrics:
    # Bearer token Prometheus sends to /actuator/prometheus. Without it production does not expose metrics.
    token: ${METRICS_TOKEN:}
  jobs:
    refresh-token-cleanup-cron: "0 17 * * * *"
