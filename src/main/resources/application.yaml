# Environment variables are the same as the Ktor server's, so this server is a drop-in replacement.
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: todo-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/todolist}
    username: ${DB_USER:todolist}
    password: ${DB_PASSWORD:todolist}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      # Only `./gradlew bootRun` uses compose.yaml (spring-boot-docker-compose is a development-only dependency).
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  # "development" (default) or "production". Production refuses to start without a real JWT_SECRET.
  environment: ${APP_ENV:development}
  # Set to true only behind a reverse proxy that sets X-Forwarded-For (e.g. Render), so rate limits see client IPs.
  trust-proxy: ${TRUST_PROXY:false}
  jwt:
    # Required in production (at least 32 characters). Without it, development uses a built-in key.
    secret: ${JWT_SECRET:}
    issuer: todolist-server
    audience: todolist-clients
    realm: todolist
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  password:
    bcrypt-cost: 12
  google:
    # Comma-separated OAuth client IDs (web, android, ios) accepted as the ID token audience.
    client-ids: ${GOOGLE_CLIENT_IDS:942997837259-p5avn0h84otleksfs47cnbrr7gs52t2c.apps.googleusercontent.com,942997837259-56nldcuks4gmmaju4hvr15ttik6ra6h7.apps.googleusercontent.com}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  metrics:
    # Bearer token Prometheus sends to /actuator/prometheus. Without it production does not expose metrics.
    token: ${METRICS_TOKEN:}
  jobs:
    refresh-token-cleanup-cron: "0 17 * * * *"
