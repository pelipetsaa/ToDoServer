name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Unit, architecture and Testcontainers-backed API tests; the runner provides Docker.
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: build/reports
      - run: docker build -t todo-server .
